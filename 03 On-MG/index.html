// ☁️ Firebase Firestore REST API 헬퍼 함수
// ==========================================
function parseFirebaseConfig(rawConfigStr) {
  if (!rawConfigStr || !rawConfigStr.trim()) return null;
  try {
    let clean = rawConfigStr.trim();
    if (clean.startsWith('const firebaseConfig =')) {
      clean = clean.replace('const firebaseConfig =', '').trim();
    }
    if (clean.endsWith(';')) clean = clean.slice(0, -1).trim();
    
    // 키 이름에 따옴표가 없을 경우를 대비한 유연한 JSON 변환
    if (!clean.includes('"apiKey"')) {
      clean = clean.replace(/([a-zA-Z0-9_]+)\s*:/g, '"$1":');
    }
    return JSON.parse(clean);
  } catch (err) {
    // 정규식 추출 폴백
    const apiKeyMatch = rawConfigStr.match(/apiKey:\s*["']([^"']+)["']/);
    const projectIdMatch = rawConfigStr.match(/projectId:\s*["']([^"']+)["']/);
    if (apiKeyMatch && projectIdMatch) {
      return { apiKey: apiKeyMatch[1], projectId: projectIdMatch[1] };
    }
    return null;
  }
}

// Firestore 클라우드로 데이터 전송 (백그라운드)
async function syncToFirestore(cfg, payload) {
  if (!cfg || !cfg.projectId || !cfg.apiKey) return false;
  const url = `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/userData/mindgym?key=${cfg.apiKey}`;
  const firestoreBody = {
    fields: {
      dataJson: { stringValue: JSON.stringify(payload) },
      updatedAt: { stringValue: new Date().toISOString() }
    }
  };
  try {
    const res = await fetch(url, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(firestoreBody)
    });
    return res.ok;
  } catch (err) {
    console.warn('Firestore auto-save error:', err);
    return false;
  }
}

// Firestore 클라우드에서 최신 데이터 가져오기 (백그라운드)
async function fetchFromFirestore(cfg) {
  if (!cfg || !cfg.projectId || !cfg.apiKey) return null;
  const url = `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/userData/mindgym?key=${cfg.apiKey}`;
  try {
    const res = await fetch(url);
    if (res.ok) {
      const doc = await res.json();
      const rawJson = doc.fields?.dataJson?.stringValue;
      if (rawJson) {
        return JSON.parse(rawJson);
      }
    }
  } catch (err) {
    console.warn('Firestore fetch error:', err);
  }
  return null;
}

function RadarBalanceChart({ muscles, activeMuscleId, onSelectMuscle, startDate, lastActiveDate }) {
  const [timeframe, setTimeframe] = useState('start');
  
  const size = 290;
  const center = size / 2;
  const radius = 100;
  const totalPoints = muscles.length;

  const getReferenceValue = (m) => {
    if (timeframe === 'start') return m.baseline;
    if (timeframe === '1m') return Math.max(m.baseline, Math.round(m.current * 0.85));
    if (timeframe === '3m') return Math.max(m.baseline, Math.round(m.current * 0.70));
    if (timeframe === '6m') return Math.max(m.baseline, Math.round(m.current * 0.55));
    return m.baseline;
  };

  const getCoordinates = (index, value) => {
    const angle = (Math.PI * 2 / totalPoints) * index - Math.PI / 2;
    const r = (value / 100) * radius;
    return {
      x: center + r * Math.cos(angle),
      y: center + r * Math.sin(angle)
    };
  };

  const levels = [20, 40, 60, 80, 100];
  const baselinePolygon = muscles.map((m, i) => {
    const { x, y } = getCoordinates(i, getReferenceValue(m));
    return `${x},${y}`;
  }).join(' ');

  const currentPolygon = muscles.map((m, i) => {
    const { x, y } = getCoordinates(i, m.current);
    return `${x},${y}`;
  }).join(' ');

  return (
    <div className="relative flex flex-col items-center justify-center p-3.5 sm:p-4 bg-white rounded-2xl shadow-xs border border-slate-100">
      
      {/* 상단: 시계열 범례 & 목표 기간 선택 */}
      <div className="w-full flex flex-col gap-2 mb-1 text-xs">
        <div className="flex items-center justify-between px-1">
          <div className="flex items-center gap-1.5 font-bold text-slate-800">
            <span className="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block"></span>
            <span>내면 근육 밸런스</span>
          </div>
          <div className="flex items-center gap-2.5 text-[11px]">
            <span className="flex items-center gap-1 text-slate-500 font-mono">
              <span className="w-2.5 h-0.5 bg-slate-400 inline-block border-b border-dashed border-slate-500"></span>
              {timeframe === 'start' ? `시작(${startDate})` : '비교 기준'}
            </span>
            <span className="flex items-center gap-1 text-blue-700 font-bold font-mono">
              <span className="w-2.5 h-2 bg-blue-500/20 border border-blue-600 inline-block rounded-xs"></span>
              현재({lastActiveDate})
            </span>
          </div>
        </div>

        {/* 시계열 비교 필터 */}
        <div className="flex items-center justify-between bg-slate-100/70 p-1 rounded-xl text-[10px] text-slate-600 font-medium">
          <span className="text-slate-400 pl-1 font-semibold">비교 기준:</span>
          <div className="flex gap-1">
            {[
              { id: 'start', label: '시작일 대비' },
              { id: '1m', label: '1개월 전' },
              { id: '3m', label: '분기(3개월)' },
              { id: '6m', label: '반기(6개월)' }
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setTimeframe(t.id)}
                className={`px-2 py-0.5 rounded-lg transition-all ${
                  timeframe === t.id
                    ? 'bg-white text-slate-900 font-bold shadow-2xs'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <svg width={size} height={size} className="overflow-visible my-1 max-w-full">
        {levels.map((lvl) => {
          const points = muscles.map((_, i) => {
            const { x, y } = getCoordinates(i, lvl);
            return `${x},${y}`;
          }).join(' ');
          return (
            <polygon key={lvl} points={points} fill="none" stroke="#F1F5F9" strokeWidth="1.2" strokeDasharray={lvl === 100 ? "0" : "3,3"} />
          );
        })}

        {muscles.map((_, i) => {
          const { x, y } = getCoordinates(i, 100);
          return <line key={i} x1={center} y1={center} x2={x} y2={y} stroke="#E2E8F0" strokeWidth="1" />;
        })}

        <polygon points={baselinePolygon} fill="none" stroke="#94A3B8" strokeWidth="1.5" strokeDasharray="4,4" className="opacity-70 transition-all duration-500" />
        <polygon points={currentPolygon} fill="rgba(37, 99, 235, 0.16)" stroke="#2563EB" strokeWidth="2.2" className="transition-all duration-700" />

        {muscles.map((m, i) => {
          const { x, y } = getCoordinates(i, m.current);
          const isSelected = activeMuscleId === m.id;
          return (
            <circle
              key={m.id}
              cx={x}
              cy={y}
              r={isSelected ? 6.5 : 4.5}
              fill={m.color}
              stroke="#FFFFFF"
              strokeWidth={isSelected ? 2.5 : 2}
              className="cursor-pointer transition-all duration-150 hover:opacity-80"
              onClick={() => onSelectMuscle(m.id)}
            />
          );
        })}

        {muscles.map((m, i) => {
          const angle = (Math.PI * 2 / totalPoints) * i - Math.PI / 2;
          const labelDist = radius + 20;
          const lx = center + labelDist * Math.cos(angle);
          const ly = center + labelDist * Math.sin(angle);
          const isSelected = activeMuscleId === m.id;

          return (
            <g key={m.id} className="cursor-pointer" onClick={() => onSelectMuscle(m.id)}>
              <text
                x={lx}
                y={ly}
                textAnchor="middle"
                dominantBaseline="central"
                className={`text-[11px] font-medium transition-all ${
                  isSelected ? 'fill-blue-600 font-bold scale-105' : 'fill-slate-600 hover:fill-slate-900'
                }`}
              >
                {m.name}
              </text>
              <text x={lx} y={ly + 11} textAnchor="middle" dominantBaseline="central" className="text-[9px] fill-slate-400 font-mono">
                {m.current}점
              </text>
            </g>
          );
        })}
      </svg>
      <div className="text-[10px] sm:text-[11px] text-slate-400 text-center mt-1">
        근육 꼭짓점을 누르면 상세한 성찰 카드를 확인하실 수 있습니다.
      </div>
    </div>
  );
}

// 5. 설정 모달
function SettingsModal({ 
  isOpen, 
  onClose, 
  muscles, 
  logs, 
  resources, 
  onRestoreData,
  alarmSettings,
  onSaveAlarmSettings,
  onTriggerTestNotification,
  onOpenVersionModal,
  startDate,
  onUpdateStartDate,
  firebaseConfigStr,
  onSaveFirebaseConfig,
  onTriggerManualCloudSync
}) {
  if (!isOpen) return null;
  const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
  const [localAlarm, setLocalAlarm] = useState({ ...alarmSettings });
  const [localStartDate, setLocalStartDate] = useState(startDate);
  const [localFbConfig, setLocalFbConfig] = useState(firebaseConfigStr);
  const [manualSyncMsg, setManualSyncMsg] = useState('');

  const handleSaveApiKey = () => {
    localStorage.setItem('gemini_api_key', apiKey.trim());
    alert('Gemini API 키가 안전하게 저장되었습니다.');
  };

  const handleSaveAlarm = () => {
    onSaveAlarmSettings(localAlarm);
    alert('⏰ 알람 설정이 안전하게 저장되었습니다.');
  };

  const handleSaveDate = () => {
    onUpdateStartDate(localStartDate);
    alert('📅 시작 기준일이 수정되었습니다.');
  };

  const handleSaveConfig = () => {
    onSaveFirebaseConfig(localFbConfig);
    alert('☁️ Firebase 연결 설정이 저장되었습니다! 이제 자동 동기화가 동작합니다.');
  };

  const handleExport = () => {
    const data = { muscles, logs, resources, startDate, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `On_MindGYM_Backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed.muscles && parsed.logs) {
          onRestoreData(parsed);
          alert('데이터가 성공적으로 동기화되었습니다!');
          onClose();
        }
      } catch (err) {
        alert('올바른 백업 파일이 아닙니다.');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3.5 sm:p-4 bg-slate-900/50 backdrop-blur-xs">
      <div className="bg-white rounded-3xl max-w-sm w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-xl border border-slate-100 space-y-4 text-xs">
        <div className="flex justify-between items-center border-b pb-3">
          <h2 className="text-sm font-bold text-slate-800">앱 설정 & 알람</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
        </div>

        {/* ☁️ Firebase 완전 자동 클라우드 동기화 안내 */}
        <div className="bg-indigo-50/70 p-3.5 rounded-2xl border border-indigo-200/70 space-y-2.5">
          <div className="flex items-center justify-between">
            <span className="font-bold text-indigo-950 flex items-center gap-1.5">
              <span>☁️</span>
              <span>Firebase 완전 자동 동기화</span>
            </span>
            <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">
              Auto-Sync On
            </span>
          </div>
          <p className="text-[11px] text-indigo-900 leading-relaxed">
            한 번만 키를 저장해 두시면 <strong>일기 작성 시 자동 백업</strong>되고, <strong>앱을 열 때 최신 상태로 자동 동기화</strong>됩니다.
          </p>

          <div className="pt-1 space-y-1.5">
            <textarea
              rows="3"

              value={localFbConfig}
              onChange={(e) => setLocalFbConfig(e.target.value)}
              className="w-full p-2 rounded-xl border border-indigo-200 bg-white font-mono text-[10px] text-slate-800"
            />
            <div className="flex gap-1.5">
              <button onClick={handleSaveConfig} className="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-[11px]">
                Firebase 설정값 저장

// 6. 마크다운 수필 렌더러
function renderMarkdownEssay(content) {
  if (!content) return null;
  const lines = content.trim().split('\n');
  return lines.map((line, idx) => {
    const trimmed = line.trim();
    if (!trimmed) return <div key={idx} className="h-2"></div>;

    if (trimmed.startsWith('###')) {
      const titleText = trimmed.replace(/^###\s*/, '');
      return (
        <h4 key={idx} className="text-sm font-bold text-slate-800 pb-2 border-b border-amber-200/60 mb-2.5 flex items-center gap-1.5">
          {titleText}
        </h4>
      );
    }

    const parts = trimmed.split(/(\*\*.*?\*\*)/g);
    return (
      <p key={idx} className="mb-2 leading-relaxed text-slate-700">
        {parts.map((part, pIdx) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return <strong key={pIdx} className="text-slate-900 font-bold">{part.slice(2, -2)}</strong>;
          }
          return part;
        })}
      </p>
    );
  });
}

      return logs.filter(l => (l.timestamp || now) >= oneWeekAgo);
    }
    if (historyPeriod === 'month') {
      const oneMonthAgo = now - 30 * 24 * 60 * 60 * 1000;
      return logs.filter(l => (l.timestamp || now) >= oneMonthAgo);
    }
    if (historyPeriod === 'year') {
      const oneYearAgo = now - 365 * 24 * 60 * 60 * 1000;
      return logs.filter(l => (l.timestamp || now) >= oneYearAgo);
    }
    return logs;

        counts[l.muscleId] += 1;
      }
    });

    let maxCount = -1;

      if (counts[mId] > maxCount) {
        maxCount = counts[mId];
        topMuscleId = mId;
      }
    });

    const topMuscle = muscles.find(m => m.id === topMuscleId);
    return {
      total: filteredHistoryLogs.length,
      counts,
      topMuscle: maxCount > 0 ? topMuscle : null,

   - 내담자가 기록한 실제 표현 인용
3. 마무리: 인생오후 상록수를 격려하며 다정한 코칭적 축복으로 마무리
4. 문체: 품격 있는 에세이 문체 (~했습니다, ~합니다).
`;

              {muscles.map((m) => (
                <div
                  key={m.id}
                  onClick={() => {
                    setActiveMuscleId(m.id);
                    setIsModalOpen(true);
                  }}
                  className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-100 shadow-xs hover:border-slate-300 transition-all cursor-pointer"
                >
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: m.color }}></span>
                      <h3 className="text-xs font-bold text-slate-800">{m.name}</h3>
                      <span className="text-[10px] text-slate-400 font-mono">({m.english})</span>
                    </div>
                    <div className="flex items-center gap-2 font-mono text-xs">
                      <span className="text-slate-400 text-[11px]">시작 {m.baseline}점</span>
                      <span className="text-slate-300">→</span>
                      <span className="font-bold text-blue-700">{m.current}점</span>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 sm:gap-2 text-[11px] pt-1 pb-1.5">
                    <div className="text-slate-500 bg-rose-50/50 p-2 rounded-lg leading-relaxed">
                      <strong className="text-rose-600 block mb-0.5">As-Is (자동 반응):</strong>
                      {m.asIs}
                    </div>
                    <div className="text-slate-600 bg-emerald-50/50 p-2 rounded-lg leading-relaxed">
                      <strong className="text-emerald-700 block mb-0.5">To-Be (성숙 모습):</strong>
                      {m.toBe}
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-50 flex items-center justify-between text-[10px] text-slate-400">
                    <span className="truncate max-w-[200px]">출처: {m.source}</span>
                    <span className="text-slate-400 shrink-0">상세 보기 및 조율 →</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 3: 실천 루틴 & 서재 */}
          {activeTab === 'rituals' && (
            <div className="space-y-3">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <h3 className="text-xs font-bold text-slate-700">마음 리추얼 & 학습 서재</h3>
                  <p className="text-[11px] text-slate-400">언제든 꺼내 읽는 성찰의 보고</p>
                </div>
                <button
                  onClick={() => setIsAddResourceOpen(true)}
                  className="w-full sm:w-auto px-3 py-2 rounded-xl bg-slate-800 text-white font-medium text-xs hover:bg-slate-900 transition-all shadow-xs flex items-center justify-center gap-1 shrink-0"
                >
                  <span>+</span>
                  <span>새 루틴/자료 추가</span>
                </button>
              </div>

              <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px] hide-scrollbar">
                {[
                  { id: 'all', label: '전체' },
                  { id: 'routine', label: '실천 루틴 🏃' },
                  { id: 'youtube', label: '유튜브 🎥' },
                  { id: 'article', label: '아티클 📖' },
                  { id: 'memo', label: '메모 ✍️' }
                ].map(f => (
                  <button
                    key={f.id}
                    onClick={() => setResourceFilter(f.id)}
                    className={`px-3 py-1.5 rounded-xl whitespace-nowrap transition-all font-medium ${
                      resourceFilter === f.id
                        ? 'bg-slate-800 text-white shadow-xs'
                        : 'bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50'
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {filteredResources.map((r) => {
                  const m = muscles.find(muscle => muscle.id === r.muscleId);
                  const typeBadge = {
                    routine: { label: '실천 루틴', bg: 'bg-blue-50 text-blue-700 border-blue-200' },
                    youtube: { label: '유튜브 영상', bg: 'bg-red-50 text-red-700 border-red-200' },
                    article: { label: '아티클/글', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
                    memo: { label: '나의 메모', bg: 'bg-amber-50 text-amber-700 border-amber-200' }
                  }[r.type] || { label: '기록', bg: 'bg-slate-50 text-slate-700 border-slate-200' };

                  return (
                    <div key={r.id} className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-100 shadow-xs flex flex-col justify-between hover:border-slate-300 transition-all">
                      <div>
                        <div className="flex justify-between items-center mb-2">
                          <div className="flex items-center gap-1.5">
                            <span className={`text-[10px] px-2 py-0.5 rounded-md font-semibold border ${typeBadge.bg}`}>
                              {typeBadge.label}
                            </span>
                            <span className="text-[10px] px-2 py-0.5 rounded-md font-semibold text-white" style={{ backgroundColor: m?.color || '#64748B' }}>
                              {m?.name}
                            </span>
                          </div>
                          {r.type === 'routine' ? (
                            <span className="text-[10px] font-medium text-slate-500">누적 {r.completedCount}회</span>
                          ) : (
                            <span className="text-[10px] text-slate-400 font-mono">{r.date}</span>
                          )}
                        </div>

                        <div className="flex items-center justify-between gap-2 mb-1.5">
                          <h4 className="text-xs font-bold text-slate-800 truncate" title={r.title}>
                            {r.title}
                          </h4>
                          {r.url && (
                            <a
                              href={r.url}
                              target="_blank"
                              rel="noreferrer"
                              className="whitespace-nowrap shrink-0 text-[10px] text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 border border-indigo-100 font-medium px-2 py-0.5 rounded-lg flex items-center gap-1 transition-all"
                            >
                              <span>링크</span>
                              <span>↗</span>
                            </a>
                          )}
                        </div>
                        <p className="text-[11px] text-slate-600 leading-relaxed whitespace-pre-wrap">{r.desc}</p>
                      </div>

                      {r.type === 'routine' && (
                        <button
                          onClick={() => {
                            const updated = resources.map(item => item.id === r.id ? { ...item, completedCount: item.completedCount + 1 } : item);
                            setResources(updated);
                            localStorage.setItem('on_mindgym_resources_v16', JSON.stringify(updated));
                            alert(`🌿 [${r.title}] 실천을 완료했습니다.`);
                            triggerAutoSaveCloud(muscles, logs, updated, startDate);
                          }}
                          className="mt-3 w-full py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 text-[11px] font-semibold rounded-xl border border-slate-200 transition-all"
                        >
                          오늘 실천 완료 체크
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 4: 나의 성장 연대기 */}
          {activeTab === 'history' && (
            <div className="space-y-3.5">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <h3 className="text-xs font-bold text-slate-800">성장 리포트 & 회고록</h3>
                  <p className="text-[11px] text-slate-400">인생오후를 채워가는 감정 근육 통계</p>
                </div>
                <div className="flex bg-slate-200/70 p-1 rounded-xl gap-1 text-[11px] font-medium text-slate-600 w-full sm:w-auto">
                  {[
                    { id: 'all', label: '전체' },
                    { id: 'week', label: '주간' },
                    { id: 'month', label: '월간' },
                    { id: 'year', label: '연간' }
                  ].map(p => (
                    <button
                      key={p.id}
                      onClick={() => setHistoryPeriod(p.id)}
                      className={`flex-1 sm:flex-initial px-2.5 py-1 rounded-lg transition-all text-center ${historyPeriod === p.id ? 'bg-white text-slate-800 font-bold shadow-2xs' : 'hover:text-slate-800'}`}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-100 shadow-xs space-y-2.5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-50 pb-2 gap-1">
                  <span className="text-xs text-slate-500">
                    선택 기간 기록: <strong className="text-slate-800 font-mono">{periodStats.total}회</strong>
                  </span>
                  {periodStats.topMuscle ? (
                    <span className="text-[10px] sm:text-[11px] px-2 py-0.5 rounded-full font-semibold inline-block w-fit" style={{ backgroundColor: `${periodStats.topMuscle.color}20`, color: periodStats.topMuscle.color }}>
                      🔥 최다 단련: {periodStats.topMuscle.name} ({periodStats.topCount}회)
                    </span>
                  ) : (
                    <span className="text-[10px] text-slate-400">기록을 시작해 보세요</span>
                  )}
                </div>

                <div className="space-y-1.5 pt-0.5">
                  {muscles.map(m => {
                    const count = periodStats.counts[m.id] || 0;
                    const pct = periodStats.total > 0 ? (count / periodStats.total) * 100 : 0;
                    return (
                      <div key={m.id} className="flex items-center gap-2 text-[11px]">
                        <span className="w-16 sm:w-20 truncate text-slate-600 font-medium text-[10px] sm:text-[11px]">{m.name}</span>
                        <div className="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden">
                          <div
                            className="h-full rounded-full transition-all duration-700"
                            style={{ width: `${pct}%`, backgroundColor: m.color }}
                          ></div>
                        </div>
                        <span className="w-7 text-right font-mono text-slate-400 text-[10px]">{count}회</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="bg-gradient-to-br from-stone-50 via-white to-amber-50/40 p-3.5 sm:p-4.5 rounded-2xl border border-amber-200/60 shadow-xs space-y-2.5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-base">🌲</span>
                    <div>
                      <h4 className="text-xs font-bold text-slate-800">인생오후 성장 회고 에세이</h4>
                      <p className="text-[10px] text-slate-400">내면의 발자국을 종합하여 한 편의 수필로 엮어냅니다</p>
                    </div>
                  </div>
                  <button
                    onClick={handleGeneratePeriodEssay}
                    disabled={isEssayLoading}
                    className="w-full sm:w-auto px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-medium text-xs rounded-xl shadow-xs transition-all flex items-center justify-center gap-1.5 disabled:opacity-50 shrink-0"
                  >
                    <span>{isEssayLoading ? '집필 중...' : '회고 에세이 집필 ✨'}</span>
                  </button>
                </div>

                {isEssayLoading && (
                  <div className="space-y-1.5 py-2">
                    <div className="h-2.5 bg-amber-100/60 rounded-full animate-pulse w-full"></div>
                    <div className="h-2.5 bg-amber-100/60 rounded-full animate-pulse w-5/6"></div>
                  </div>
                )}

                {periodEssay && !isEssayLoading && (
                  <div className="bg-white/90 p-3.5 sm:p-4 rounded-xl border border-amber-100/80 text-xs text-slate-700 leading-relaxed shadow-2xs">
                    {renderMarkdownEssay(periodEssay)}
                  </div>
                )}
              </div>

              <div className="space-y-2 pt-1">
                <h4 className="text-xs font-bold text-slate-700">기록된 마음 챙김 일기 ({filteredHistoryLogs.length}개)</h4>
                {filteredHistoryLogs.length === 0 ? (
                  <div className="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">
                    선택하신 기간에 기록된 일기가 없습니다.
                  </div>
                ) : (
                  filteredHistoryLogs.map((log) => {
                    const m = muscles.find(muscle => muscle.id === log.muscleId);
                    return (
                      <div key={log.id} className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-100 shadow-xs space-y-1.5 hover:border-slate-300 transition-all">
                        <div className="flex justify-between items-center">
                          <div className="flex items-center gap-1.5">
                            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: m?.color }}></span>
                            <span className="text-xs font-bold text-slate-800">{m?.name}</span>
                            {log.ritualTitle && (
                              <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md truncate max-w-[130px]">
                                {log.ritualTitle}
                              </span>
                            )}
                          </div>
                          <span className="text-[10px] text-slate-400 font-mono shrink-0">{log.date}</span>
                        </div>
                        <div className="text-xs space-y-1 text-slate-700 pt-0.5 leading-relaxed">
                          <p><strong className="text-slate-500">감정:</strong> {log.feeling}</p>
                          <p><strong className="text-slate-700">시도:</strong> {log.action}</p>
                          <p><strong className="text-emerald-700">여운:</strong> {log.shift}</p>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </section>
      </main>

      {/* 3. 하단 릴리즈 푸터 */}
      <footer className="release-footer pt-1 pb-5 text-center text-slate-400 text-xs flex items-center justify-center gap-1.5 sm:gap-2 border-t border-slate-200/60">
        <span>On溫 Mind GYM</span>
        <span className="font-mono font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md text-[10px] sm:text-[11px]">{CURRENT_VERSION}</span>
        <span>·</span>
        <button
          type="button"
          onClick={() => setIsVersionOpen(true)}
          className="text-indigo-600 hover:text-indigo-800 hover:underline font-medium transition-all"
        >
          버전 기록 보기
        </button>
      </footer>

      {/* 모달 4종 */}
      <MuscleDetailModal muscle={selectedMuscleObj} isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={handleSaveMuscle} />
      <AddResourceModal isOpen={isAddResourceOpen} onClose={() => setIsAddResourceOpen(false)} onAddResource={handleAddResource} muscles={muscles} />
      <SettingsModal
        isOpen={isSettingsOpen}
        onClose={() => setIsSettingsOpen(false)}
        muscles={muscles}
        logs={logs}
        resources={resources}
        onRestoreData={handleRestoreData}
        alarmSettings={alarmSettings}
        onSaveAlarmSettings={handleSaveAlarmSettings}
        onTriggerTestNotification={handleTriggerTest}
        onOpenVersionModal={() => setIsVersionOpen(true)}
        startDate={startDate}
        onUpdateStartDate={handleUpdateStartDate}
        firebaseConfigStr={firebaseConfigStr}
        onSaveFirebaseConfig={handleSaveFirebaseConfig}
        onTriggerManualCloudSync={handleManualCloudSync}
      />
      <VersionModal isOpen={isVersionOpen} onClose={() => setIsVersionOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
